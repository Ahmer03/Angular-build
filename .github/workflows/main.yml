name: Build Angular App

on: 
  push:
    branches: [ main ]

jobs:
    build-angular-app:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4
        - name: Setup Node JS
          uses: actions/setup-node@v4
          with:
            node-version: 22.x    
        - name: Install dependicies
          run: npm install
        - name: Build Angular App    
          run: npm run build
